[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcast"
version = "0.1.0"
description = "Playlist maintenance and AI host orchestration tools for NeuralCast stations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "mutagen",
    "yt-dlp",
    "spotipy",
    "musicbrainzngs",
    "python-dotenv",
    "tqdm",
    "requests",
    "openai",
    "google-genai",
    "pydantic",
    "pillow",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[project.scripts]
neuralcast-sync = "neuralcast.cli.sync_playlists:run"
neuralcast-new-releases = "neuralcast.cli.update_new_releases:run"
neuralcast-host = "neuralcast.cli.host_orchestrator:main"
neuralcast-schedule = "neuralcast.cli.schedule_generator:main"
neuralcast-admin-api = "neuralcast.cli.admin_api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--import-mode=importlib",
    "-m",
    "not integration and not live",
]
markers = [
    "unit: fast isolated unit tests",
    "boundary: offline tests that exercise multiple internal modules",
    "integration: tests that may use external services or installed system tools",
    "live: tests that require live credentials or mutate external systems",
    "slow: tests that are intentionally slower than normal unit tests",
    "requires_credentials: tests that require locally configured secrets",
    "allow_external_calls: opt out of the unit-test network/subprocess guard",
]
